[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langcomp"
version = "0.2.0"
description = "A developer-friendly, high-level complementary framework for LangChain, LangGraph, and DeepAgents."
readme = "README.md"
authors = [
    { name = "AR_S.DADRAS", email = "arsdadras@github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
sqlite = [
    "langgraph-checkpoint-sqlite>=2.0.0",
]
postgres = [
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1.0",
]
deepagents = [
    "deepagents>=0.1.0; python_version >= '3.11'",
]
visualizer = [
    "grandalf>=0.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.8.0",
]
all = [
    "langcomp[sqlite,postgres,deepagents,visualizer,dev]",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/langcomp"]
